# default configuration, override in config/local-development.toml

# port to listen on
port = 8800

# whether the app runs behind a trusted proxy
proxy = true

# application name used for logging and service namespace
name = 'imagehoster'

# number of worker processes to spawn, 0 = autodetect
num_workers = 0

# Max Sharp encodes running at once PER WORKER (service-wide = this x num_workers).
# Sharp shares the libuv threadpool with fs reads, so unbounded encodes starve
# cached-variant reads and oversubscribe the CPU. 0/unset = auto (cpus/workers).
max_concurrent_encodes = 0

# url to hive node used for verifying signatures
rpc_node = 'https://api.hive.blog'


# S3-compatible storage credentials
# Works with: AWS S3, Backblaze B2, MinIO, DigitalOcean Spaces, Wasabi, Cloudflare R2, etc.
# Uses separate buckets for uploads (long-term) and proxy cache (ephemeral)
# Override in config/local-development.toml or set as environment variables
#


S3_ACCESS_KEY_ID = ''
S3_SECRET_ACCESS_KEY = ''
S3_ENDPOINT = 's3.us-west-000.backblazeb2.com'
S3_REGION = 'us-west-000'

# url where service is running
service_url = 'https://i.ecency.com'

# default user avatar, should be a png minimum 512x512
#default_avatar = 'https://i.ecency.com/DQmUVRvAmChYcJqBifekwpR9UTsxSbbbnEi9kJXRWEGzX47/ecency_default_avatar.png'
default_avatar = 'https://i.ecency.com/DQmSaeyWEevGPZR3gJ13z9fR9psqkrHmHrsfp4oD7qAPKih/hive_default_avatar.png'
default_cover = 'https://i.ecency.com/DQmdA9wjRyGmDwrTza59yLSjCWMEc9sFD5sC4ZU5kL9UMqo/cover_fallback_day.png'

# log level to output at
#log_level = 'debug'
#log_level = 'info'
log_level = 'error'

# where to write logs, can be file path or stdout/err
log_output = 'stdout'

# max image size to allow uploading and proxying, in bytes
max_image_size = 20000000 # 20mb

# Reject decompression bombs: maximum input pixels (width*height) Sharp will
# decode. 100 MP (~10000x10000) admits all real-world photos and phone cameras
# while blocking pathological inputs that would otherwise decode to ~1GB+ of raw
# bitmap and exhaust worker memory (a 16000x16000 image is ~1GB decoded).
max_input_pixels = 100000000

# Optional temporary bridge to another imagehoster origin that still holds
# originals this instance has not received yet (e.g. mid-migration). Tried after
# the source URL but before the public mirrors, so live origins are unaffected
# and only the dead-origin tail reaches it. Unset once migration completes.
#
# MUST be publicly routable: every candidate is checked by assertPublicUrl, so a
# private/loopback address (10.x, 172.16-31.x, 192.168.x, 127.x) is skipped with
# a warning and the bridge silently does nothing.
# bridge_origin = 'http://198.51.100.10'

# redis db used for ratelimiting uploads
# redis_url = 'redis://localhost'
redis_url = 'redis://myredis'
# redis_password = '' # Set in config/local-development.toml

# sentry error tracking (optional)
# sentry_dsn = '' # Set in config/local-development.toml or production.toml

# cloudflare cache purging (optional)
# cloudflare_token = '' # Set in config/local-development.toml
# cloudflare_zone = '' # Set in config/local-development.toml

# Token required for cache invalidation requests (?invalidate=1) on /p/*, /u/*/avatar, /u/*/cover
# Clients must send header: X-Invalidate-Key: <invalidate_token>
# invalidate_token = '' # Set in config/local-development.toml

# dynamic blacklist configuration
# Fetches blacklists from remote URLs and caches in memory with TTL
# Falls back to local JSON files (blacklist-images.json, blacklist-accounts.json) if fetch fails
# JSON format: { "images": ["url1", "url2", ...], "accounts": ["user1", "user2", ...], "updated": "ISO8601", "version": "1.0" }
[blacklist]
cache_ttl = 1800000 # 30 minutes in ms
images_url = 'https://ecency.com/dmca/dmca-images.json'
accounts_url = 'https://ecency.com/dmca/dmca-accounts.json'

# upload rate and reputation limits, rate limits only enforced if redis db is configured
[upload_limits]
duration = 604800000 # in ms (=1 week)
max = 700 # max requests within duration
reputation = 10 # minimum reputation needed for upload
app_account = 'ecency.app'
app_posting_wif = '' # Set in config/local-development.toml - Hive posting private key

# blob stores, valid types are: memory, s3, fs
# the s3 type additionally needs the s3_bucket key to be set and expects
# the proper AWS credentials to be configured (see aws-sdk for more info)

# where to keep uploaded images
[upload_store]
type = 's3'
s3_bucket = 'eupload-bucket'

# where to keep proxied images
[proxy_store]
type = 'fs'
s3_bucket = 'eproxy-bucket'

max_image_width = 1280
max_image_height = 1280
max_custom_image_width = 2000
max_custom_image_height = 2000

# Optional durable archive of originals whose upstream no longer exists.
# Consulted on a local proxy-store miss, BEFORE any network fetch. Like the
# upload store it is an origin and not a cache, so cache-bypass flags never skip
# it. Same store types as upload_store/proxy_store. Leave unset to disable.
# [retention_store]
# type = 's3'
# s3_bucket = 'eretention'
