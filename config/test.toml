# Fixed encode-concurrency limit so tests exercise a real ceiling (>1)
max_concurrent_encodes = 3

log_level = 'fatal'

# Match the test server URL so double-proxy detection works
service_url = 'http://localhost:63205'

# Disable Redis for tests (avoids connection timeout crash)
redis_url = ''

# Allow exercising the invalidate path in tests
invalidate_token = 'test-invalidate-token'

# The shared fixture (test/test.jpg) is ~5MB and several tests re-render it into
# a second variant with the source server switched off, which only works if the
# original was cached. Keep the cap at the upload limit here so those tests keep
# exercising the store path; the production 1MB default is covered by the
# shouldCacheOriginal unit tests.
max_cached_original_size = 20000000

# Use memory stores for tests so caching actually works
# (default.toml uses filesystem at /mnt/eproxy-bucket which doesn't exist locally)
[upload_store]
type = 'memory'

[proxy_store]
type = 'memory'
